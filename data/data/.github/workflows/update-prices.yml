name: Update prices
on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Commit if changed
        run: |
          git config user.name "ktmtechlab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: update prices" && git push; fi
